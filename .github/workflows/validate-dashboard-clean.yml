name: Validate clean dashboard restore

on:
  push:
    branches:
      - dashboard-clean-restore

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete test suite
        run: python -m pytest tests -q
      - name: Build public dashboard
        run: python web/build.py
      - name: Run dashboard tests
        run: python -m pytest tests/test_public_dashboard.py -q
      - name: Verify generated dashboard
        run: |
          test -f web/dist/index.html
          test -f web/dist/data/cases.json
          test -d web/dist/downloads
          test -n "$(find web/dist/downloads -name '*.xlsx' -print -quit)"
          test -n "$(find web/dist -maxdepth 1 -name 'app.js' -print -quit)"
          test -n "$(find web/dist -maxdepth 1 -name 'styles.css' -print -quit)"
          python -c "import json; assert json.load(open('web/dist/data/cases.json', encoding='utf-8'))"
          grep -Eq 'app\.js\?v=[0-9a-f]{12}' web/dist/index.html
          grep -Eq 'styles\.css\?v=[0-9a-f]{12}' web/dist/index.html
      - name: Upload dashboard preview
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-clean-preview
          path: web/dist
          if-no-files-found: error
