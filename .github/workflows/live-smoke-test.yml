name: YieldCurve LIVE smoke test

on:
  workflow_dispatch:
    inputs:
      fecha_corte:
        description: Fecha de corte ISO 8601 (YYYY-MM-DD)
        required: false
        default: '2026-11-11'
        type: string

permissions:
  contents: read

jobs:
  live-smoke-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run one authorized LIVE case
        id: live_case
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BANXICO_API_TOKEN: ${{ secrets.BANXICO_API_TOKEN }}
          FECHA_CORTE: ${{ inputs.fecha_corte }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY is not configured."
            exit 1
          fi
          if [ -z "${BANXICO_API_TOKEN:-}" ]; then
            echo "BANXICO_API_TOKEN is not configured."
            exit 1
          fi
          evidence_dir="$(mktemp -d)"
          evidence_path="$evidence_dir/live_case.json"
          echo "evidence_path=$evidence_path" >> "$GITHUB_OUTPUT"
          python -m backend.run_yieldcurve_live --date "$FECHA_CORTE" --evidence "$evidence_path"

      - name: Verify sanitized evidence
        id: evidence_check
        if: always()
        env:
          EVIDENCE_PATH: ${{ steps.live_case.outputs.evidence_path }}
        run: |
          if [ -z "${EVIDENCE_PATH:-}" ] || [ ! -f "$EVIDENCE_PATH" ]; then
            echo "safe=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -E -q 'sk-|Bmx-Token|OPENAI_API_KEY|BANXICO_API_TOKEN|Authorization:|Bearer ' "$EVIDENCE_PATH"; then
            echo "Evidence failed the secret-safety check."
            echo "safe=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "safe=true" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized LIVE evidence
        if: always() && steps.evidence_check.outputs.safe == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: yieldcurve-live-smoke-evidence
          path: ${{ steps.live_case.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
