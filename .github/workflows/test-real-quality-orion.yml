name: YieldCurve real quality Orion

on:
  workflow_dispatch:
    inputs:
      fecha_corte:
        description: Fecha de corte esperada en formato YYYY-MM-DD
        required: true
        default: '2026-11-11'
        type: string

permissions:
  contents: read

jobs:
  real-quality-orion:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate date input
        env:
          FECHA_CORTE: ${{ inputs.fecha_corte }}
        run: python -c "import os; from datetime import date; date.fromisoformat(os.environ['FECHA_CORTE'])"
      - name: Run real quality loop and Orion
        env:
          BANXICO_API_TOKEN: ${{ secrets.BANXICO_API_TOKEN }}
          FECHA_CORTE: ${{ inputs.fecha_corte }}
        run: |
          if [ -z "${BANXICO_API_TOKEN:-}" ]; then
            echo "BANXICO_API_TOKEN is not configured."
            exit 1
          fi
          python -m backend.run_real_quality_orion_live "$FECHA_CORTE"
