name: Deploy dashboard Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "data/public/**", "backend/public_artifacts.py", "backend/case_excel.py", "tests/**", ".github/workflows/pages.yml"]
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
      - run: python web/build.py
      - run: python -m pytest tests/test_public_dashboard.py -q
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: web/dist}
  deploy:
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
