name: Test Elara live

on:
  workflow_dispatch:
    inputs:
      confirm_live_test:
        description: Confirmar una llamada única a GPT-6 Luna
        required: true
        default: "NO_EJECUTAR"
        type: choice
        options:
          - "NO_EJECUTAR"
          - "EJECUTAR_UNA_VEZ"

permissions:
  contents: read

concurrency:
  group: elara-live-test
  cancel-in-progress: false

jobs:
  live-test:
    if: ${{ inputs.confirm_live_test == 'EJECUTAR_UNA_VEZ' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run one controlled Elara request
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python backend/run_elara_live.py --evidence artifacts/elara-live-evidence.json

      - name: Upload sanitized evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: elara-live-evidence
          path: artifacts/elara-live-evidence.json
          if-no-files-found: error
          retention-days: 7
